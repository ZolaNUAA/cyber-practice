services:
  nginx-lab:
    image: nginx:1.25-alpine
    container_name: nginx-lab
    profiles: ["recon", "info-leak", "logs", "incident"]
    ports:
      - "${LAB_BIND_ADDR:-127.0.0.1}:8082:80"
    volumes:
      - ./services/nginx-lab/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./services/nginx-lab/html:/usr/share/nginx/html:ro
      - ./logs/nginx:/var/log/nginx

  ssh-lab:
    build: ./services/ssh-lab
    container_name: ssh-lab
    profiles: ["recon", "auth", "logs", "incident"]
    ports:
      - "${LAB_BIND_ADDR:-127.0.0.1}:2222:22"

  upload-lab:
    build: ./services/upload-lab
    container_name: upload-lab
    profiles: ["recon", "upload", "incident"]
    ports:
      - "${LAB_BIND_ADDR:-127.0.0.1}:8086:8080"
    volumes:
      - ./logs/upload:/app/logs

  cmd-lab:
    build: ./services/cmd-lab
    container_name: cmd-lab
    profiles: ["cmd"]
    ports:
      - "${LAB_BIND_ADDR:-127.0.0.1}:8087:8080"

  priv-lab:
    build: ./services/priv-lab
    container_name: priv-lab
    profiles: ["priv"]
    tty: true

  traffic-lab:
    build: ./services/traffic-lab
    container_name: traffic-lab
    profiles: ["recon", "traffic", "logs"]
    ports:
      - "${LAB_BIND_ADDR:-127.0.0.1}:8089:8080"
    volumes:
      - ./logs/traffic:/app/logs

  ids-lab:
    image: alpine:3.19
    container_name: ids-lab
    profiles: ["ids"]
    command: ["sh", "-c", "echo 'IDS evidence is in /evidence/eve.json'; tail -f /dev/null"]
    volumes:
      - ./evidence/ids:/evidence:ro

  juice-shop:
    image: bkimminich/juice-shop:latest
    container_name: juice-shop
    profiles: ["recon", "sqli", "xss"]
    ports:
      - "${LAB_BIND_ADDR:-127.0.0.1}:3000:3000"

  webgoat:
    image: webgoat/webgoat:latest
    container_name: webgoat
    profiles: ["recon", "sqli", "xss"]
    environment:
      SERVER_ADDRESS: 0.0.0.0
    ports:
      - "${LAB_BIND_ADDR:-127.0.0.1}:8080:8080"

  incident-lab:
    build: ./services/incident-lab
    container_name: incident-lab
    profiles: ["incident"]
    ports:
      - "${LAB_BIND_ADDR:-127.0.0.1}:8092:8080"
    volumes:
      - ./logs/incident:/app/logs
