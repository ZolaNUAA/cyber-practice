server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    # Exam gateway. Students should harden this Nginx service config.
    # Start vulnerable: sensitive paths and active upload content are exposed.
    #
    # Goal: fix root-cause configuration problems while keeping /health working.
    # After changes, restart with:
    #   docker compose -f docker-compose.yml restart exam-gateway

    location /backup/ {
        autoindex on;
    }

    location /public/ {
        autoindex on;
    }

    location /admin/ {
        autoindex on;
    }

    location /uploads/ {
    }

    location / {
        proxy_pass http://exam-app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
