server {
    listen 80;
    server_name _;
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Lab12 temporary containment example:
    # block exposed backup browsing during incident response.
    location /backup/ {
        return 403;
    }

    # Block common sensitive file extensions at the web-server layer.
    location ~* \.(bak|old|sql|conf|env)$ {
        return 403;
    }
}
